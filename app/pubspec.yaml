name: skinsavvy_app
description: SkinSavvy - kişisel cilt bakım asistanı.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Durum yönetimi ve yönlendirme
  provider: ^6.1.5
  go_router: ^18.0.0

  # Kalıcı kayıt (web'de localStorage, mobilde SharedPreferences/NSUserDefaults)
  shared_preferences: ^2.5.0
  crypto: ^3.0.6

  # Sunucu modu (API_URL verilirse)
  http: ^1.6.0

  # Fotoğraf seçme ve paylaşma
  image_picker: ^1.2.0
  share_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Testlerde galeri yerine sahte fotoğraf seçici.
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
