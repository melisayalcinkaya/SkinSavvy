name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  app:
    name: Flutter uygulaması
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: Web derlemesi
        run: flutter build web --release --base-href /SkinSavvy/

      - name: Pages paketi
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  backend:
    name: FastAPI sunucusu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Bağımlılıklar
        run: pip install -r requirements-dev.txt

      - name: Lint ve biçim
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Testler (kapsam alt sınırı %90)
        run: pytest --cov --cov-report=term --cov-fail-under=90

      - name: Docker imajı ve duman testi
        run: |
          docker build -t skinsavvy-api .
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            skinsavvy-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/products | python -c "import json,sys; assert json.load(sys.stdin)['total'] == 12"
          curl -fsS -X POST localhost:8000/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"demo@skinsavvy.app","password":"demo-sifre-2026"}' | grep -q accessToken
          curl -fsSI localhost:8000/health | grep -qi strict-transport-security
          docker logs api

  deploy:
    name: GitHub Pages
    # Yalnızca main'e gönderimde ve iki iş de geçtiyse yayınla.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
